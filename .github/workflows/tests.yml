name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_DATABASE: dmstest_control
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, pdo_sqlite, gd, zip
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Validate modules
        run: php artisan modules:validate

      - name: Lab bridge tests
        run: cd bridge && python3 -m unittest discover -s tests -t .

      - name: Tests on SQLite (fast)
        run: php artisan test

      # The same tests again on MySQL, which also runs the row-locking test
      # that SQLite skips.
      - name: Tests on MySQL
        env:
          DB_DRIVER: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dmstest_control
          DB_USERNAME: root
          DB_PASSWORD: ci-root-password
          CLINIC_DB_USER_HOST: '%'
        run: php artisan test

      - name: Check dependencies for known vulnerabilities
        run: composer audit
