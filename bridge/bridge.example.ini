; DMS lab bridge settings. Copy to bridge.ini and fill in.

[server]
; The clinic's DMS address.
url = https://yourclinic.example.com
; The machine's key from DMS: Lab machines > Machines (shown once when the machine is added).
key = anz_PASTE_THE_KEY_HERE
; Only if the server uses a private certificate:
; ca_file = C:\dms-bridge\server-ca.pem

[machine]
; astm or hl7: see the machine's interface (LIS / host) manual.
protocol = astm
; serial (RS-232 cable), tcp-server (the machine connects to this PC),
; or tcp-client (this PC connects to the machine).
connection = serial

; For serial:
port = COM1
baud = 9600
bytesize = 8
parity = N
stopbits = 1

; For tcp-server:
; listen_host = 0.0.0.0
; listen_port = 5100

; For tcp-client:
; machine_host = 192.168.1.50
; machine_port = 5100

[bridge]
; Where the queue and the log file are kept.
data_folder = C:\dms-bridge\data
